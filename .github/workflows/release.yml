name: Release

# Tag-driven: bump [workspace.package] version, merge to master, then tag the
# *merged* commit. Tagging before the merge is how v0.3.1 ended up dangling —
# a squash-merge rewrites the commit, and the tag keeps pointing at the original.
#
# `workflow_dispatch` with dry_run builds and verifies everything without
# publishing anywhere, which is the only way to find out that (say) the macOS
# wheel job is broken *before* the day you announce a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and verify, publish nothing'
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── The gate everything else waits on ──────────────────────────────────
  guard:
    name: Version agrees with tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      # On a tag push, the tag must match the workspace version. On a manual
      # run there is no tag, so only the internal consistency check applies.
      - id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ./scripts/check_versions.sh "${{ github.ref_name }}"
          else
            ./scripts/check_versions.sh
          fi
          version=$(sed -n '/^\[workspace\.package\]/,/^\[[^w]/ s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Publish only from a real tag, and never from a dry run.
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  # ── PyPI: wheels for people with no Rust toolchain ─────────────────────
  sdist:
    name: sdist
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist

  wheels-linux:
    name: wheels (linux ${{ matrix.target }})
    needs: guard
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    target: x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@v4
      # The interpreters are named, not discovered. `--find-interpreter` takes
      # every interpreter in the manylinux image, and that image ships PyPy
      # beside CPython: pyo3 0.22 supports PyPy up to 3.10, the image carries
      # PyPy 3.11, and the build fails on an interpreter no wheel was ever
      # wanted for. Naming them also makes this job's coverage the same list as
      # the macOS and Windows jobs, which never had the choice.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: >-
            --release --out dist
            --interpreter python3.9 python3.10 python3.11 python3.12 python3.13
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.target }}
          path: dist

  wheels-macos:
    name: wheels (macos ${{ matrix.target }} py${{ matrix.python }})
    needs: guard
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # `target` and `python` are the real axes, and `runner` is attached
        # to each by the `include` below. It has to be this way round: GitHub
        # builds the cross product from the axes alone, applies `exclude` to
        # it, and only then merges `include`. A key that exists only in
        # `include` is therefore not a key `exclude` can name, and naming one
        # is a parse error that fails the whole workflow before a job starts.
        target: [x86_64, aarch64]
        # No abi3: pyo3 is built against a specific CPython here, so each
        # version needs its own wheel. Switching to abi3 would collapse this
        # matrix to one job per target — worth revisiting once rust-numpy's
        # abi3 support is confirmed against the arrays we return.
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
        exclude:
          # actions/setup-python has no arm64 macOS build this far back, so
          # this combination cannot be built rather than being declined:
          # Apple-silicon users on 3.9 fall back to the sdist. Revisit if
          # anyone asks; dropping requires-python to >=3.10 would also do it.
          - { target: aarch64, python: '3.9' }
        # Neither entry adds a job: each names an existing `target`, so its
        # `runner` is merged into the combinations already there.
        # macos-13 was retired; `-intel` images are the x86_64 line now and
        # every unsuffixed macos-* label is Apple silicon.
        include:
          - { target: x86_64,  runner: macos-15-intel }
          - { target: aarch64, runner: macos-14 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python${{ matrix.python }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-${{ matrix.target }}-${{ matrix.python }}
          path: dist

  # ── Windows wheels ─────────────────────────────────────────────────────
  #
  # x86_64 only. GitHub has no hosted Windows-on-arm runner, and a wheel built
  # by cross-compiling could not be imported anywhere in this workflow, which
  # would make it the one artefact here that nothing has ever run.
  #
  # Each CPython gets its own job, as on macOS and for the same reason: pyo3 is
  # built against a specific interpreter, so there is no abi3 wheel to collapse
  # them into.
  wheels-windows:
    name: wheels (windows ${{ matrix.target }} py${{ matrix.python }})
    needs: guard
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x64]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.target }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-${{ matrix.target }}-${{ matrix.python }}
          path: dist

  # Install the built wheel on a clean machine and use it — both ways in.
  # A wheel that builds and does not import is the failure this catches, and
  # it is invisible to every other job here.
  smoke-wheel:
    name: Installed wheel actually works
    needs: [wheels-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-x86_64
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --find-links dist fairchild-sim
          cat > rc.sp <<'EOF'
          * rc smoke
          V1 in 0 PULSE(0 1 0 1n 1n 1u 2u)
          R1 in out 1k
          C1 out 0 1n
          .tran 1e-8 2e-6
          .end
          EOF
          # The console script the wheel installs — not the repo's binary.
          fairchild --file rc.sp --check
          fairchild --file rc.sp --probe "V(out)" --output out.csv
          head -2 out.csv
          # ...and the library half of the same wheel.
          python -c "import fairchild; fairchild.Circuit(); print('import ok')"
          # A failing run must return non-zero without killing the interpreter.
          python - <<'PY'
          from fairchild.fairchild import _cli_main
          assert _cli_main(["fairchild", "--file", "/nope.sp"]) == 1
          print("error path ok, interpreter alive")
          PY

  pypi:
    name: Publish to PyPI
    needs: [guard, sdist, wheels-linux, wheels-macos, wheels-windows, smoke-wheel]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's OIDC identity, so
      # there is no API token in repo secrets to leak or rotate.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # ── crates.io: source, for Rust consumers ──────────────────────────────
  crates:
    name: Publish to crates.io
    needs: [guard, smoke-wheel]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsuitesparse-dev
      # Dependency order, not alphabetical: each crate must find its deps
      # already on the registry. fairchild-py is publish = false — it only
      # ever builds a CPython extension module.
      - run: |
          for crate in fairchild-parser fairchild-klu fairchild-core \
                       fairchild-osdi fairchild-cli fairchild-c; do
            echo "::group::publish $crate"
            cargo publish -p "$crate"
            echo "::endgroup::"
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── GitHub Releases: the only home the C library has ───────────────────
  binaries:
    name: binaries (${{ matrix.name }})
    needs: guard
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    name: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, name: linux-aarch64 }
          - { runner: macos-15-intel,   name: macos-x86_64 }
          - { runner: macos-14,         name: macos-aarch64 }
          - { runner: windows-latest,   name: windows-x86_64 }
    defaults:
      run:
        # Git Bash on the Windows runner, so one `Package` step serves all four
        # platforms instead of a PowerShell copy of it that would drift.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release -p fairchild-cli -p fairchild-c

      # Two tarballs, because they answer different questions: one is "give me
      # the simulator", the other is "let me link against it".
      # Windows names its artefacts differently at every turn: `fairchild.exe`,
      # `fairchild_c.dll` beside an import library `fairchild_c.dll.lib`, and
      # no `lib` prefix anywhere. Each is copied by name rather than by a glob,
      # so a missing one fails this step instead of shipping a tarball that is
      # quietly short a file.
      - name: Package
        run: |
          set -euo pipefail
          v="${{ needs.guard.outputs.version }}"
          n="${{ matrix.name }}"
          mkdir -p out stage/cli stage/lib/include stage/lib/lib

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/fairchild.exe stage/cli/
            cp target/release/fairchild_c.dll stage/lib/lib/
            # The import library. Without it nothing can link against the DLL.
            cp target/release/fairchild_c.dll.lib stage/lib/lib/
            # And the static half, which MSVC spells without the `lib` prefix
            # and with `.lib` rather than `.a`. Both halves ship on the other
            # platforms, so both ship here.
            cp target/release/fairchild_c.lib stage/lib/lib/
          else
            cp target/release/fairchild stage/cli/
            cp target/release/libfairchild_c.a stage/lib/lib/
            cp target/release/libfairchild_c.so stage/lib/lib/ 2>/dev/null || \
              cp target/release/libfairchild_c.dylib stage/lib/lib/
          fi

          cp LICENSE README.md stage/cli/
          tar -C stage/cli -czf "out/fairchild-$v-$n.tar.gz" .

          cp crates/fairchild-c/include/fairchild.h stage/lib/include/
          cp LICENSE crates/fairchild-c/README.md stage/lib/
          tar -C stage/lib -czf "out/libfairchild_c-$v-$n.tar.gz" .

          ls -lh out/
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: out

  github-release:
    name: GitHub release
    needs: [guard, binaries, smoke-wheel]
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: out
      - run: gh release create "${{ github.ref_name }}" out/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
