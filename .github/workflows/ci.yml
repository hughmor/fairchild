name: CI

on:
  # All branches, not just master. Work here lands as worktree branches merged
  # locally, so a master-only trigger means nothing is ever checked until after
  # the merge — too late to be a gate.
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The Verilog-A compiler the OSDI tests compile their fixtures with. Pinned:
  # the version string goes into every cache key, and a floating "latest" would
  # change what the tests ran against without saying so.
  OPENVAF_VERSION: v24.0.1mob

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: rust-toolchain.toml is the single source, and
      # the rustup shim installs it (with its components) on the first cargo call.
      # Pinning in both places is how they drift apart.
      - name: Show Rust toolchain (pinned by rust-toolchain.toml)
        run: rustc --version && cargo clippy --version && cargo fmt --version

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install SuiteSparse + ngspice (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libsuitesparse-dev ngspice

      - name: Install SuiteSparse + ngspice (macOS)
        if: runner.os == 'macOS'
        run: brew install suite-sparse ngspice

      # The Linux release of openvaf-r links against the system LLVM 21 — its
      # bundled `lib/` is four symlinks into `/usr/lib/x86_64-linux-gnu`, and
      # nothing else. Noble ships LLVM 18 at the newest, so the runtime comes
      # from apt.llvm.org (the same snapshot the release was built against, by
      # date). The macOS tarball carries a real `libLLVM.dylib` and needs none of
      # this.
      - name: Install LLVM 21 runtime (Linux, for openvaf-r)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libllvm21

      # The OSDI tests compile Verilog-A from `crates/fairchild-osdi/tests/models`
      # with the real compiler. A prebuilt release is used rather than a build
      # from source: building OpenVAF needs an LLVM *development* install and
      # several minutes, against a download of 26 MB (Linux) or 61 MB (macOS).
      - name: Cache openvaf-r
        uses: actions/cache@v4
        with:
          path: ~/.local/openvaf
          key: ${{ runner.os }}-openvaf-${{ env.OPENVAF_VERSION }}

      - name: Install openvaf-r
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.local/openvaf/bin/openvaf-r" ]; then
            case "${{ runner.os }}" in
              Linux) asset="openvaf-r-$OPENVAF_VERSION-linux-x86_64.tar.gz" ;;
              macOS) asset="openvaf-r-$OPENVAF_VERSION-macos-aarch64.tar.gz" ;;
            esac
            url="https://github.com/OpenVAF/OpenVAF-Reloaded/releases/download/$OPENVAF_VERSION/$asset"
            # Straight into place, stripping the tarball's own top directory. An
            # earlier version downloaded, extracted and then moved the result by
            # glob — and the glob matched the tarball as well as the directory it
            # had just produced, so `mv` saw two sources and demanded an existing
            # target.
            mkdir -p "$HOME/.local/openvaf"
            curl -fsSL "$url" | tar xz -C "$HOME/.local/openvaf" --strip-components=1
            # The macOS tarball's Mach-O files were modified after signing
            # (their install names were rewritten), so the kernel refuses to run
            # them: SIGKILL, before any output. Re-signing ad hoc is the fix, and
            # it has to cover the dylibs too — the binary dies on the first one
            # it loads.
            if [ "${{ runner.os }}" = "macOS" ]; then
              for f in "$HOME/.local/openvaf"/lib/*.dylib "$HOME/.local/openvaf/bin/openvaf-r"; do
                codesign --force --sign - "$f"
              done
            fi
            # On Linux that `lib/` holds only dangling symlinks — they point at
            # `../../x86_64-linux-gnu/`, which is the packaging machine's system
            # path, not ours. Left in place they are worse than useless: put them
            # on the loader's path and the dangling `libLLVM.so.21.1` shadows the
            # good copy apt just installed.
            if [ "${{ runner.os }}" = "Linux" ]; then
              rm -rf "$HOME/.local/openvaf/lib"
            fi
          fi
          echo "$HOME/.local/openvaf/bin" >> "$GITHUB_PATH"

      # Every ngspice golden test skips itself — green, having compared nothing —
      # when ngspice is not on PATH, and every OSDI test does the same without a
      # Verilog-A compiler. That is a dozen suites of reference comparison
      # silently doing nothing, so fail loudly here instead.
      - name: Assert ngspice and openvaf-r are on PATH
        run: |
          command -v ngspice
          command -v openvaf-r
          openvaf-r --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The full suite runs ONCE, with `klu`, because that feature is purely
      # additive: `SolverKind::Auto` picks dense or faer-sparse and never KLU
      # either way, so all 764 tests exercise the same backends in both
      # configurations — `--features klu` adds `solver_klu` on top. Running both
      # cost 8 minutes to test 4 minutes' worth of code twice.
      #
      # What the klu build genuinely cannot reach is the *refusal* of
      # `.options solver=klu` when the feature is absent. That is one runtime
      # `cfg!`, it lives in `fairchild-core`'s lib tests, and it is the reason
      # for the cheap default-features run below rather than a second full one.
      # (It was also untested until #68 — so the second full run had been
      # verifying nothing the first did not.)
      - name: Test (default features — the paths a klu build cannot reach)
        run: cargo test -p fairchild-core --lib

      - name: Clippy (with klu)
        run: cargo clippy --workspace --all-targets --features klu -- -D warnings

      - name: Test (with klu — the whole workspace)
        run: cargo test --workspace --features klu

      - name: Check benchmarks compile
        run: cargo test --workspace --benches

      # The KiCad symbol library is hand-edited *and* partly generated, so the
      # generated half drifts silently unless something checks it.
      - name: KiCad symbol library is up to date
        if: runner.os == 'Linux'
        run: python3 scripts/gen_kicad_symbols.py --check

      # The extension is not rebuilt by `cargo build`, so in a checkout it can be
      # months older than the Rust it claims to be — and it imports anyway. The
      # guard that refuses one is pure Python and self-checking; run it here
      # rather than on a stale artefact nobody notices.
      - name: Python extension staleness guard — self-check
        run: python3 python/fairchild/_freshness.py

      # cargo test --workspace builds fairchild-py as a plain lib, which never
      # exercises the extension-module build or python/fairchild/__init__.py.
      # A renamed pyo3 export breaks `import fairchild` with every Rust test green.
      - name: Python bindings — build wheel, import, run a transient (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --upgrade maturin numpy
          maturin build --release --out dist
          python3 -m pip install --no-index --find-links dist fairchild
          python3 - <<'PY'
          import fairchild
          DECK = """* rc smoke
          V1 in 0 PULSE(0 1 0 1n 1n 1u 2u)
          R1 in out 1k
          C1 out 0 1n
          .tran 1e-8 2e-6 0 1e-9
          """
          c = fairchild.Circuit()
          c.load_str(DECK)
          r = c.run("tran", stop=2e-6, step=1e-8)
          v = r["v(out)"]
          assert r.is_tran and len(v) > 10, (r.signals(), len(v))
          # RC = 1k * 1n = 1us and the pulse falls at 1us, so the peak is one
          # time constant of charging: 1 - 1/e = 0.6321.
          assert 0.60 < v.max() < 0.66, v.max()
          # A .tran card is honoured as a unit or not at all (issue #33). The run
          # above supplied its own timing, so the card's 1 ns tmax must not clamp
          # it; run("tran") with no timing takes the whole card, ceiling included,
          # and that shows up as an order more rows.
          assert c.analyses[0]["tmax"] == 1e-9, c.analyses
          whole = c.run("tran")
          assert len(whole.time()) > 5 * len(v), (len(whole.time()), len(v))
          bare = fairchild.Circuit()
          bare.load_str(DECK.replace(".tran 1e-8 2e-6 0 1e-9", ""))
          try:
              bare.run("tran")
              raise AssertionError("no card and no kwargs must be an error")
          except RuntimeError as e:
              assert "step=" in str(e) and ".tran card" in str(e), e
          print(f"ok: {len(v)} points, vmax={v.max():.4f}, card-adopted {len(whole.time())}")

          # issue #56: run(params=...) was accepted and dropped, so a fitting
          # loop returned its initial guess and reported success. Checked by
          # DIFFERENCING two runs — reading the value back is the check that
          # passes against this bug.
          ov = fairchild.Circuit()
          ov.load_str("* p\nV1 a 0 1\nR1 a 0 1k\n.op\n.end\n")
          lo = ov.run("op", params={"R1.value": 1e3})["i(v1)"][0]
          hi = ov.run("op", params={"R1.value": 5e2})["i(v1)"][0]
          assert abs(lo - hi) > 1e-6, f"params= is a no-op: {lo} == {hi}"
          assert abs(ov.run("op")["i(v1)"][0] - lo) < 1e-15, "override leaked to the next run"
          try:
              ov.run("op", params={"R9.value": 1.0})
              raise AssertionError("an override that matched nothing was accepted")
          except RuntimeError as e:
              assert "element.param" in str(e), e

          # issue #57: an '=' inside a $ comment parsed as another assignment.
          cm = fairchild.Circuit()
          cm.load_str("* c\n.param sw = 0 $ 0 = off, 1 = on\nV1 a 0 1\nR1 a 0 1k $ load = 1k\n.op\n.end\n")
          assert abs(cm.run("op")["i(v1)"][0] + 1e-3) < 1e-12, cm.run("op")["i(v1)"]
          print("ok: params= overrides bite, and $ comments with '=' parse")
          PY

          # The bindings and the CLI once disagreed by a factor of 116 on a noise
          # figure, because the loaded extension predated the fix. Nothing checked
          # that the two frontends agree, so the only reason it was ever found was
          # somebody comparing by hand. Noise is the analysis it happened on, and
          # the one with the most machinery between the deck and the number.
          cat > /tmp/agree.sp <<'SP'
          * RC thermal noise
          V1 in 0 DC 1 AC 1
          R1 in out 1k
          C1 out 0 1u
          .noise V(out) V1 dec 3 10 1k
          SP
          cargo run --release -q -p fairchild-cli -- -f /tmp/agree.sp > /tmp/agree.csv
          python3 - <<'PY'
          import fairchild, numpy as np
          rows = [l.split(",") for l in open("/tmp/agree.csv").read().splitlines()[1:]]
          cli_f = np.array([float(r[0]) for r in rows])
          cli_on = np.array([float(r[1]) for r in rows])
          c = fairchild.Circuit()
          c.load_str(open("/tmp/agree.sp").read())
          r = c.run("noise")
          py_f, py_on = np.asarray(r.freq()), np.asarray(r["onoise"])
          assert len(cli_f) == len(py_f), (len(cli_f), len(py_f))
          # 1e-6, because the CLI's CSV prints 6 decimal places and that is the
          # floor of this comparison — not because the two paths are expected to
          # differ. The discrepancy this exists to catch was a factor of 116.
          for a, b, f in zip(py_on, cli_on, cli_f):
              rel = abs(a - b) / max(abs(b), 1e-30)
              assert rel < 1e-6, f"onoise disagrees at {f} Hz: python={a} cli={b} rel={rel}"
          print(f"ok: bindings and CLI agree on {len(cli_f)} noise points")
          PY

      # The C header is hand-written, so nothing in the Rust tests catches it
      # drifting from the exported signatures.  Compiling a real C consumer
      # against it does, and running it proves the library links and steps.
      - name: C API — compile and run the example against the header
        run: |
          cargo build -p fairchild-c --release
          cc -O2 -Wall -Wextra -Werror \
            -o /tmp/mixed_signal crates/fairchild-c/examples/mixed_signal.c \
            -I crates/fairchild-c/include -L target/release -lfairchild_c
          LD_LIBRARY_PATH=target/release DYLD_LIBRARY_PATH=target/release /tmp/mixed_signal
