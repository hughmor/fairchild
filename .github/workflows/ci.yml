name: CI

on:
  # `push:` on every branch ran the whole matrix TWICE for every pull request —
  # once for the push, once for the PR, on the same commit. Work is reviewed
  # through PRs now, so the PR trigger is the gate and `push` covers what has no
  # PR: master itself, and a tag.
  #
  # The cost is that a branch merged locally without ever opening a PR is first
  # checked on master, after the merge. That was the reason for the old
  # all-branches trigger; if it starts to bite, the answer is a PR, not a second
  # run of everything.
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

# A second push supersedes the first: cancel the run it obsoleted rather than
# paying for an answer about a commit nobody will look at. Never cancels on
# master, where every commit's result is a fact worth having.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The Verilog-A compiler the OSDI tests compile their fixtures with. Pinned:
  # the version string goes into every cache key, and a floating "latest" would
  # change what the tests ran against without saying so.
  OPENVAF_VERSION: v24.0.1mob

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: rust-toolchain.toml is the single source, and
      # the rustup shim installs it (with its components) on the first cargo call.
      # Pinning in both places is how they drift apart.
      - name: Show Rust toolchain (pinned by rust-toolchain.toml)
        run: rustc --version && cargo clippy --version && cargo fmt --version

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # `Cargo.lock` is deliberately not committed (this tree publishes a
          # crate), so `hashFiles('**/Cargo.lock')` used to find nothing and the
          # key collapsed to a constant — which is worse than no key at all:
          # `actions/cache` does not save on a hit, so the very first `target/`
          # ever stored was the one every later run restored, and everything that
          # had changed since was recompiled every time. Keyed on the manifests
          # and the toolchain instead, with the run id making every key unique so
          # each run saves a fresh copy and `restore-keys` picks up the newest.
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}-
            ${{ runner.os }}-cargo-

      - name: Install SuiteSparse + ngspice (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libsuitesparse-dev ngspice

      - name: Install SuiteSparse + ngspice (macOS)
        if: runner.os == 'macOS'
        run: brew install suite-sparse ngspice

      # The Linux release of openvaf-r links against the system LLVM 21 — its
      # bundled `lib/` is four symlinks into `/usr/lib/x86_64-linux-gnu`, and
      # nothing else. Noble ships LLVM 18 at the newest, so the runtime comes
      # from apt.llvm.org (the same snapshot the release was built against, by
      # date). The macOS tarball carries a real `libLLVM.dylib` and needs none of
      # this.
      - name: Install LLVM 21 runtime (Linux, for openvaf-r)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libllvm21

      # The OSDI tests compile Verilog-A from `crates/fairchild-osdi/tests/models`
      # with the real compiler. A prebuilt release is used rather than a build
      # from source: building OpenVAF needs an LLVM *development* install and
      # several minutes, against a download of 26 MB (Linux) or 61 MB (macOS).
      - name: Cache openvaf-r
        uses: actions/cache@v4
        with:
          path: ~/.local/openvaf
          key: ${{ runner.os }}-openvaf-${{ env.OPENVAF_VERSION }}

      - name: Install openvaf-r
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.local/openvaf/bin/openvaf-r" ]; then
            case "${{ runner.os }}" in
              Linux) asset="openvaf-r-$OPENVAF_VERSION-linux-x86_64.tar.gz" ;;
              macOS) asset="openvaf-r-$OPENVAF_VERSION-macos-aarch64.tar.gz" ;;
            esac
            url="https://github.com/OpenVAF/OpenVAF-Reloaded/releases/download/$OPENVAF_VERSION/$asset"
            # Straight into place, stripping the tarball's own top directory. An
            # earlier version downloaded, extracted and then moved the result by
            # glob — and the glob matched the tarball as well as the directory it
            # had just produced, so `mv` saw two sources and demanded an existing
            # target.
            mkdir -p "$HOME/.local/openvaf"
            curl -fsSL "$url" | tar xz -C "$HOME/.local/openvaf" --strip-components=1
            # The macOS tarball's Mach-O files were modified after signing
            # (their install names were rewritten), so the kernel refuses to run
            # them: SIGKILL, before any output. Re-signing ad hoc is the fix, and
            # it has to cover the dylibs too — the binary dies on the first one
            # it loads.
            if [ "${{ runner.os }}" = "macOS" ]; then
              for f in "$HOME/.local/openvaf"/lib/*.dylib "$HOME/.local/openvaf/bin/openvaf-r"; do
                codesign --force --sign - "$f"
              done
            fi
            # On Linux that `lib/` holds only dangling symlinks — they point at
            # `../../x86_64-linux-gnu/`, which is the packaging machine's system
            # path, not ours. Left in place they are worse than useless: put them
            # on the loader's path and the dangling `libLLVM.so.21.1` shadows the
            # good copy apt just installed.
            if [ "${{ runner.os }}" = "Linux" ]; then
              rm -rf "$HOME/.local/openvaf/lib"
            fi
          fi
          echo "$HOME/.local/openvaf/bin" >> "$GITHUB_PATH"

      # Every ngspice golden test skips itself — green, having compared nothing —
      # when ngspice is not on PATH, and every OSDI test does the same without a
      # Verilog-A compiler. That is a dozen suites of reference comparison
      # silently doing nothing, so fail loudly here instead.
      - name: Assert ngspice and openvaf-r are on PATH
        run: |
          command -v ngspice
          command -v openvaf-r
          openvaf-r --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # A doc link that does not resolve is a comment pointing at code that is
      # not there. `cargo doc` has always found these and nobody read the output;
      # 24 had accumulated, two of them real.
      - name: Doc links resolve
        run: cargo doc --workspace --no-deps

      # Since #76, `SolverKind::Auto` prefers KLU when the feature is compiled
      # in — so the two configurations genuinely exercise different backends
      # (they used to be identical, which is why this was once a single full
      # run plus a token lib-test pass):
      #
      #   * default features — what a plain `cargo install` ships: Auto is
      #     dense/faer-sparse. Every backend-sensitive suite (the analyses,
      #     the ngspice goldens) lives in fairchild-core, so `-p
      #     fairchild-core` keeps golden coverage of the faer paths without
      #     re-running the parser/OSDI/CLI suites that never touch a solver.
      #     This config is also the only one that can reach the runtime
      #     refusal of `.options solver=klu` (#68), in the lib tests.
      #
      #   * --features klu — the whole workspace, with KLU as what Auto picks.
      - name: Test (default features — faer-sparse as Auto, and the klu refusal)
        run: cargo test -p fairchild-core

      - name: Clippy (with klu)
        run: cargo clippy --workspace --all-targets --features klu -- -D warnings

      - name: Test (with klu — the whole workspace)
        run: cargo test --workspace --features klu

      - name: Check benchmarks compile
        run: cargo test --workspace --benches

      # The KiCad symbol library is hand-edited *and* partly generated, so the
      # generated half drifts silently unless something checks it.
      - name: KiCad symbol library is up to date
        if: runner.os == 'Linux'
        run: python3 scripts/gen_kicad_symbols.py --check

      # The extension is not rebuilt by `cargo build`, so in a checkout it can be
      # months older than the Rust it claims to be — and it imports anyway. The
      # guard that refuses one is pure Python and self-checking; run it here
      # rather than on a stale artefact nobody notices.
      - name: Python extension staleness guard — self-check
        run: python3 python/fairchild/_freshness.py

      # cargo test --workspace builds fairchild-py as a plain lib, which never
      # exercises the extension-module build or python/fairchild/__init__.py.
      # A renamed pyo3 export breaks `import fairchild` with every Rust test green.
      - name: Python bindings — build wheel, import, run a transient (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --upgrade maturin numpy
          maturin build --release --out dist
          python3 -m pip install --no-index --find-links dist fairchild
          python3 - <<'PY'
          import fairchild
          DECK = """* rc smoke
          V1 in 0 PULSE(0 1 0 1n 1n 1u 2u)
          R1 in out 1k
          C1 out 0 1n
          .tran 1e-8 2e-6 0 1e-9
          """
          c = fairchild.Circuit()
          c.load_str(DECK)
          r = c.run("tran", stop=2e-6, step=1e-8)
          v = r["v(out)"]
          assert r.is_tran and len(v) > 10, (r.signals(), len(v))
          # RC = 1k * 1n = 1us and the pulse falls at 1us, so the peak is one
          # time constant of charging: 1 - 1/e = 0.6321.
          assert 0.60 < v.max() < 0.66, v.max()
          # A .tran card is honoured as a unit or not at all (issue #33). The run
          # above supplied its own timing, so the card's 1 ns tmax must not clamp
          # it; run("tran") with no timing takes the whole card, ceiling included,
          # and that shows up as an order more rows.
          assert c.analyses[0]["tmax"] == 1e-9, c.analyses
          whole = c.run("tran")
          assert len(whole.time()) > 5 * len(v), (len(whole.time()), len(v))
          bare = fairchild.Circuit()
          bare.load_str(DECK.replace(".tran 1e-8 2e-6 0 1e-9", ""))
          try:
              bare.run("tran")
              raise AssertionError("no card and no kwargs must be an error")
          except RuntimeError as e:
              assert "step=" in str(e) and ".tran card" in str(e), e
          print(f"ok: {len(v)} points, vmax={v.max():.4f}, card-adopted {len(whole.time())}")

          # issue #56: run(params=...) was accepted and dropped, so a fitting
          # loop returned its initial guess and reported success. Checked by
          # DIFFERENCING two runs — reading the value back is the check that
          # passes against this bug.
          ov = fairchild.Circuit()
          ov.load_str("* p\nV1 a 0 1\nR1 a 0 1k\n.op\n.end\n")
          lo = ov.run("op", params={"R1.value": 1e3})["i(v1)"][0]
          hi = ov.run("op", params={"R1.value": 5e2})["i(v1)"][0]
          assert abs(lo - hi) > 1e-6, f"params= is a no-op: {lo} == {hi}"
          assert abs(ov.run("op")["i(v1)"][0] - lo) < 1e-15, "override leaked to the next run"
          try:
              ov.run("op", params={"R9.value": 1.0})
              raise AssertionError("an override that matched nothing was accepted")
          except RuntimeError as e:
              assert "element.param" in str(e), e

          # issue #57: an '=' inside a $ comment parsed as another assignment.
          cm = fairchild.Circuit()
          cm.load_str("* c\n.param sw = 0 $ 0 = off, 1 = on\nV1 a 0 1\nR1 a 0 1k $ load = 1k\n.op\n.end\n")
          assert abs(cm.run("op")["i(v1)"][0] + 1e-3) < 1e-12, cm.run("op")["i(v1)"]
          print("ok: params= overrides bite, and $ comments with '=' parse")

          # The small-signal reports are their own methods, not run() kinds, so
          # nothing in the block above touches them. The numbers are pinned in
          # Rust against ngspice; what is checked here is the binding surface
          # and the deck-vs-caller rule (#33), which only exists in Python.
          import math
          ss = fairchild.Circuit()
          ss.load_str("""* divider
          Vin in 0 DC 1
          R1 in out 1k
          R2 out 0 3k
          .tf v(out) Vin
          .sens v(out)
          """)
          assert [a["kind"] for a in ss.analyses] == ["tf", "sens"], ss.analyses
          card = ss.tf()
          assert math.isclose(card["gain"], 0.75, rel_tol=1e-6), card
          assert math.isclose(card["r_in"], 4000.0, rel_tol=1e-6), card
          assert math.isclose(card["r_out"], 750.0, rel_tol=1e-6), card
          assert ss.tf(out="v(out)", src="Vin") == card, "kwargs and card disagree"
          try:
              ss.tf(out="v(out)")   # half a card is never applied
              raise AssertionError("tf(out=) without src= must be an error")
          except RuntimeError as e:
              assert "src" in str(e), e
          # Both spellings are the same call, and neither returns a SimResult.
          assert ss.run("tf") == card, "run('tf') and ckt.tf() disagree"
          assert not hasattr(ss.run("tf"), "time"), "a report must not be a SimResult"
          assert ss.run("tran", step=1e-9, stop=1e-8).is_tran, "run() still returns SimResult"

          rows = ss.sens()
          assert [r["param"] for r in rows] == ["vin.value", "r1.value", "r2.value"], rows
          assert all(r["reached"] for r in rows), rows
          assert math.isclose(rows[1]["sensitivity"], -1.875e-4, rel_tol=1e-5), rows[1]

          pzc = fairchild.Circuit()
          pzc.load_str("* rlc\nVin in 0 DC 0 AC 1\nR1 in a 100\nL1 a out 1m\nC1 out 0 1n\n")
          pr = pzc.pz(in_pos="in", out_pos="out")
          assert len(pr["poles"]) == 2, pr
          for p in pr["poles"]:
              assert isinstance(p, complex) and math.isclose(p.real, -5e4, rel_tol=1e-5), p
          print(f"ok: tf/sens/pz reachable, card-vs-kwargs honoured, {len(pr['poles'])} poles")

          # run_all() means *all*: the deck's analyses crossed with the .alter x
          # .temp grid, which is what the CLI does with the same file. The bug
          # this guards is the grid silently collapsing to one corner.
          rc = fairchild.Circuit()
          rc.load_str("""* corners
          Vin in 0 DC 1
          R1 in out 1k
          R2 out 0 3k
          .temp -40 27 125
          .op
          .tf v(out) Vin
          .alter slow
          R1 in out 2k
          """)
          assert len(rc.corners) == 6, rc.corners          # (base, slow) x 3 temps
          assert rc.corners[0]["alter"] == "base", rc.corners[0]
          all_rows = rc.run_all()
          assert len(all_rows) == 12, len(all_rows)        # 6 corners x 2 analyses
          assert {r["alter"] for r in all_rows} == {"base", "slow"}
          assert {round(r["temp_c"]) for r in all_rows} == {-40, 27, 125}
          # The alter axis must actually reach the numbers: r_in is R1 + R2.
          rin = {r["alter"]: r["result"]["r_in"] for r in all_rows
                 if r["kind"] == "tf" and round(r["temp_c"]) == 27}
          assert round(rin["base"]) == 4000 and round(rin["slow"]) == 5000, rin
          # A single corner is run() with alter=/temp=; asking run_all for one
          # is a contradiction, not a filter.
          try:
              rc.run_all(alter="slow")
              raise AssertionError("run_all(alter=) must be refused")
          except RuntimeError as e:
              assert "every corner" in str(e), e
          print(f"ok: run_all covered {len(all_rows)} rows over {len(rc.corners)} corners")

          # Every analysis has a method AND a name, and they are the same call.
          # A renamed pyo3 export or a method that stopped delegating shows up
          # here and nowhere in the Rust tests.
          mc = fairchild.Circuit()
          mc.load_str("""* every analysis
          Vin in 0 DC 1 AC 1
          R1 in out 1k
          R2 out 0 3k
          C1 out 0 1n
          .op
          .tran 1n 20n
          .ac dec 10 1 1meg
          .noise V(out) Vin dec 5 1 1meg
          .dc Vin 0 2 0.5
          .tf v(out) Vin
          .sens v(out)
          .pz in 0 out 0 vol pz
          """)
          WAVE = ["op", "tran", "ac", "noise", "dc_sweep"]
          for nm in WAVE + ["tf", "sens", "pz", "dc"]:
              assert hasattr(mc, nm), f"ckt.{nm}() is missing"
          for nm in WAVE:
              a, b = getattr(mc, nm)(), mc.run(nm)
              assert a.signals() == b.signals(), nm
              assert hasattr(a, "time"), f"{nm}() must return a SimResult"
          for nm in ["tf", "sens", "pz"]:
              assert getattr(mc, nm)() == mc.run(nm), nm
              assert not hasattr(getattr(mc, nm)(), "time"), f"{nm}() must be a report"
          # `.dc` reports kind 'dc_sweep', so run(a["kind"]) round-trips to the
          # analysis the deck declared instead of quietly running an .op.
          assert "dc_sweep" in [a["kind"] for a in mc.analyses], mc.analyses
          assert mc.run("dc_sweep").is_dc_sweep and mc.op().is_dc
          print(f"ok: {len(mc.analyses)} analyses, each reachable both ways")
          PY

          # The bindings and the CLI once disagreed by a factor of 116 on a noise
          # figure, because the loaded extension predated the fix. Nothing checked
          # that the two frontends agree, so the only reason it was ever found was
          # somebody comparing by hand. Noise is the analysis it happened on, and
          # the one with the most machinery between the deck and the number.
          cat > /tmp/agree.sp <<'SP'
          * RC thermal noise
          V1 in 0 DC 1 AC 1
          R1 in out 1k
          C1 out 0 1u
          .noise V(out) V1 dec 3 10 1k
          SP
          cargo run --release -q -p fairchild-cli -- -f /tmp/agree.sp > /tmp/agree.csv
          python3 - <<'PY'
          import fairchild, numpy as np
          rows = [l.split(",") for l in open("/tmp/agree.csv").read().splitlines()[1:]]
          cli_f = np.array([float(r[0]) for r in rows])
          cli_on = np.array([float(r[1]) for r in rows])
          c = fairchild.Circuit()
          c.load_str(open("/tmp/agree.sp").read())
          r = c.run("noise")
          py_f, py_on = np.asarray(r.freq()), np.asarray(r["onoise"])
          assert len(cli_f) == len(py_f), (len(cli_f), len(py_f))
          # 1e-6, because the CLI's CSV prints 6 decimal places and that is the
          # floor of this comparison — not because the two paths are expected to
          # differ. The discrepancy this exists to catch was a factor of 116.
          for a, b, f in zip(py_on, cli_on, cli_f):
              rel = abs(a - b) / max(abs(b), 1e-30)
              assert rel < 1e-6, f"onoise disagrees at {f} Hz: python={a} cli={b} rel={rel}"
          print(f"ok: bindings and CLI agree on {len(cli_f)} noise points")
          PY

      # `SimOptions::set` is shared by `.options`, `--opt` and every Python
      # kwarg, so the Rust suite covers the parsing. What it cannot cover is
      # stderr — an option whose *value* fails to parse must say so, and that
      # warning is the only thing standing between a mistyped `--opt` and a run
      # silently tuned with the defaults. Nor can it cover the CLI's own
      # plumbing: `--opt` and the deck's `.options` reaching the same solver.
      - name: Solver options — the value reaches the solver, and a bad one is reported
        run: |
          cargo build --release
          cat > /tmp/opt_rc.sp <<'SP'
          * rc
          V1 in 0 PULSE(0 1 0 1p 1p 1 2)
          R1 in out 1k
          C1 out 0 1n
          .tran 100n 3u
          SP
          FC=target/release/fairchild

          # A value the option cannot parse is named, not swallowed. This was
          # silent: every numeric arm read `parse_num(v).unwrap_or(default)`.
          $FC -f /tmp/opt_rc.sp --opt reltol=banana 2>&1 >/dev/null \
            | grep -q "reltol=banana" \
            || { echo "FAIL: an unparseable option value was not reported"; exit 1; }
          $FC -f /tmp/opt_rc.sp --opt itl1=lots 2>&1 >/dev/null \
            | grep -q "itl1=lots" \
            || { echo "FAIL: an unparseable integer option was not reported"; exit 1; }

          # An unknown key is still reported (it already was; this keeps it).
          $FC -f /tmp/opt_rc.sp --opt notanoption=1 2>&1 >/dev/null \
            | grep -qi "unknown solver option" \
            || { echo "FAIL: an unknown option key was not reported"; exit 1; }

          # A good value is silent — otherwise the checks above pass on noise.
          if $FC -f /tmp/opt_rc.sp --opt reltol=1e-6 2>&1 >/dev/null | grep -q .; then
            echo "FAIL: a valid option produced a warning"; exit 1
          fi

          # `--opt` and `.options` reach the same solver: same key, same answer.
          $FC -f /tmp/opt_rc.sp --opt method=gear > /tmp/via_opt.csv
          cat > /tmp/opt_rc_deck.sp <<'SP'
          * rc
          V1 in 0 PULSE(0 1 0 1p 1p 1 2)
          R1 in out 1k
          C1 out 0 1n
          .options method=gear
          .tran 100n 3u
          SP
          $FC -f /tmp/opt_rc_deck.sp > /tmp/via_deck.csv
          cmp -s /tmp/via_opt.csv /tmp/via_deck.csv \
            || { echo "FAIL: --opt and .options disagree"; diff /tmp/via_opt.csv /tmp/via_deck.csv; exit 1; }

          # And the option does something: #93 had `gear` byte-identical to `be`
          # through this exact path, with every Rust golden green.
          $FC -f /tmp/opt_rc.sp --opt method=be > /tmp/m_be.csv
          $FC -f /tmp/opt_rc.sp --opt method=tr > /tmp/m_tr.csv
          for pair in "be:gear" "be:tr" "tr:gear"; do
            a=${pair%%:*}; b=${pair##*:}
            [ "$a" = "gear" ] && fa=/tmp/via_opt.csv || fa=/tmp/m_$a.csv
            [ "$b" = "gear" ] && fb=/tmp/via_opt.csv || fb=/tmp/m_$b.csv
            if cmp -s "$fa" "$fb"; then
              echo "FAIL: method=$a and method=$b are byte-identical (this is #93)"; exit 1
            fi
          done
          echo "ok: options reach the solver, bad values are reported, methods differ"

      # The C header is hand-written, so nothing in the Rust tests catches it
      # drifting from the exported signatures.  Compiling a real C consumer
      # against it does, and running it proves the library links and steps.
      - name: C API — compile and run the example against the header
        run: |
          cargo build -p fairchild-c --release
          cc -O2 -Wall -Wextra -Werror \
            -o /tmp/mixed_signal crates/fairchild-c/examples/mixed_signal.c \
            -I crates/fairchild-c/include -L target/release -lfairchild_c
          LD_LIBRARY_PATH=target/release DYLD_LIBRARY_PATH=target/release /tmp/mixed_signal
