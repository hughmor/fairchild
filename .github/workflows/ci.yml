name: CI

on:
  # All branches, not just master. Work here lands as worktree branches merged
  # locally, so a master-only trigger means nothing is ever checked until after
  # the merge — too late to be a gate.
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # No version here on purpose: rust-toolchain.toml is the single source, and
      # the rustup shim installs it (with its components) on the first cargo call.
      # Pinning in both places is how they drift apart.
      - name: Show Rust toolchain (pinned by rust-toolchain.toml)
        run: rustc --version && cargo clippy --version && cargo fmt --version

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install SuiteSparse + ngspice (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libsuitesparse-dev ngspice

      - name: Install SuiteSparse + ngspice (macOS)
        if: runner.os == 'macOS'
        run: brew install suite-sparse ngspice

      # Every ngspice golden test skips itself — green, having compared nothing —
      # when ngspice is not on PATH. That is 9 suites of reference comparison
      # silently doing nothing, so fail loudly here instead.
      - name: Assert ngspice is on PATH
        run: command -v ngspice

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (default features)
        run: cargo test --workspace

      - name: Clippy (with klu)
        run: cargo clippy --workspace --all-targets --features klu -- -D warnings

      - name: Test (with klu)
        run: cargo test --workspace --features klu

      - name: Check benchmarks compile
        run: cargo test --workspace --benches

      # The KiCad symbol library is hand-edited *and* partly generated, so the
      # generated half drifts silently unless something checks it.
      - name: KiCad symbol library is up to date
        if: runner.os == 'Linux'
        run: python3 scripts/gen_kicad_symbols.py --check

      # cargo test --workspace builds fairchild-py as a plain lib, which never
      # exercises the extension-module build or python/fairchild/__init__.py.
      # A renamed pyo3 export breaks `import fairchild` with every Rust test green.
      - name: Python bindings — build wheel, import, run a transient (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --upgrade maturin numpy
          maturin build --release --out dist
          python3 -m pip install --no-index --find-links dist fairchild
          python3 - <<'PY'
          import fairchild
          c = fairchild.Circuit()
          c.load_str("""* rc smoke
          V1 in 0 PULSE(0 1 0 1n 1n 1u 2u)
          R1 in out 1k
          C1 out 0 1n
          """)
          r = c.run("tran", stop=2e-6, step=1e-8)
          v = r["v(out)"]
          assert r.is_tran and len(v) > 10, (r.signals(), len(v))
          # RC = 1k * 1n = 1us and the pulse falls at 1us, so the peak is one
          # time constant of charging: 1 - 1/e = 0.6321.
          assert 0.60 < v.max() < 0.66, v.max()
          print(f"ok: {len(v)} points, vmax={v.max():.4f}")
          PY

      # The C header is hand-written, so nothing in the Rust tests catches it
      # drifting from the exported signatures.  Compiling a real C consumer
      # against it does, and running it proves the library links and steps.
      - name: C API — compile and run the example against the header
        run: |
          cargo build -p fairchild-c --release
          cc -O2 -Wall -Wextra -Werror \
            -o /tmp/mixed_signal crates/fairchild-c/examples/mixed_signal.c \
            -I crates/fairchild-c/include -L target/release -lfairchild_c
          LD_LIBRARY_PATH=target/release DYLD_LIBRARY_PATH=target/release /tmp/mixed_signal
