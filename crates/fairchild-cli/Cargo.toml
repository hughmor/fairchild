[package]
name = "fairchild-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line driver for the fairchild electro-optic circuit simulator."

[[bin]]
name = "fairchild"
path = "src/main.rs"

[dependencies]
fairchild-core   = { workspace = true }
fairchild-parser = { workspace = true }
fairchild-osdi   = { workspace = true, optional = true }
clap             = { workspace = true }
rayon            = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
default = ["osdi"]
osdi = ["dep:fairchild-osdi"]
# Forwards to fairchild-core/klu — see that crate for prerequisites
# (system suite-sparse install).
klu = ["fairchild-core/klu"]
