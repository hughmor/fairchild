[package]
name = "fairchild-cli"
version.workspace = true
edition = "2021"

[[bin]]
name = "fairchild"
path = "src/main.rs"

[dependencies]
fairchild-core   = { workspace = true }
fairchild-parser = { workspace = true }
fairchild-osdi   = { workspace = true, optional = true }
clap             = { workspace = true }
rayon            = { workspace = true }

[features]
default = ["osdi"]
osdi = ["dep:fairchild-osdi"]
# Forwards to fairchild-core/klu — see that crate for prerequisites
# (system suite-sparse install).
klu = ["fairchild-core/klu"]
