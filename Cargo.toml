[workspace]
members = [
    "crates/fairchild-core",
    "crates/fairchild-parser",
    "crates/fairchild-cli",
    "crates/fairchild-osdi",
    "crates/osdi-mock",
    "crates/fairchild-py",
]
resolver = "2"

[workspace.dependencies]
fairchild-core   = { path = "crates/fairchild-core" }
fairchild-parser = { path = "crates/fairchild-parser" }
fairchild-osdi   = { path = "crates/fairchild-osdi" }

faer        = "0.24"
thiserror   = "2"
indexmap    = "2"
libc        = "0.2"
clap        = { version = "4", features = ["derive"] }
pyo3        = { version = "0.22", features = ["extension-module"] }
numpy       = "0.22"
