[workspace]
members = [
    "crates/fairchild-core",
    "crates/fairchild-parser",
    "crates/fairchild-cli",
    "crates/fairchild-c",
    "crates/fairchild-osdi",
    "crates/fairchild-klu",
    "crates/fairchild-py",
]
resolver = "2"

# One version for the whole workspace: crates inherit it with
# `version.workspace = true`, and pyproject.toml takes it from fairchild-py via
# `dynamic = ["version"]`. Releasing is bumping this line, then tagging v<that>.
[workspace.package]
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
authors = ["Hugh Morison"]
repository = "https://github.com/hughmor/fairchild"
description = "Open-source time-domain electro-optic circuit simulator: a SPICE analog solver with a native photonic discipline."
readme = "README.md"
keywords = ["spice", "simulation", "photonics", "circuit", "eda"]
categories = ["science", "simulation"]

[workspace.dependencies]
# The `version` on each internal dependency is what crates.io needs and a
# path-only workspace never does: publishing strips `path` and puts the version
# requirement in its place, so `cargo publish` refuses a dependency without one.
# Cargo has no `version.workspace = true` for [workspace.dependencies], so these
# five copies of the version are unavoidable — `scripts/check_versions.sh`
# exists because they are, and CI runs it.
fairchild-core   = { path = "crates/fairchild-core",   version = "0.3.1" }
fairchild-parser = { path = "crates/fairchild-parser", version = "0.3.1" }
fairchild-osdi   = { path = "crates/fairchild-osdi",   version = "0.3.1" }
fairchild-klu    = { path = "crates/fairchild-klu",    version = "0.3.1" }
fairchild-cli    = { path = "crates/fairchild-cli",    version = "0.3.1", default-features = false }

faer        = "0.24"
rayon       = "1"
thiserror   = "2"
indexmap    = "2"
libc        = "0.2"
clap        = { version = "4", features = ["derive"] }
pyo3        = { version = "0.22", features = ["extension-module"] }
numpy       = "0.22"
