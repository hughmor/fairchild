[workspace]
members = [
    "crates/fairchild-core",
    "crates/fairchild-parser",
    "crates/fairchild-cli",
    "crates/fairchild-c",
    "crates/fairchild-osdi",
    "crates/fairchild-klu",
    "crates/fairchild-py",
]
resolver = "2"

# One version for the whole workspace: crates inherit it with
# `version.workspace = true`, and pyproject.toml takes it from fairchild-py via
# `dynamic = ["version"]`. Releasing is bumping this line, then tagging v<that>.
[workspace.package]
version = "0.1.0"

[workspace.dependencies]
fairchild-core   = { path = "crates/fairchild-core" }
fairchild-parser = { path = "crates/fairchild-parser" }
fairchild-osdi   = { path = "crates/fairchild-osdi" }
fairchild-klu    = { path = "crates/fairchild-klu" }

faer        = "0.24"
rayon       = "1"
thiserror   = "2"
indexmap    = "2"
libc        = "0.2"
clap        = { version = "4", features = ["derive"] }
pyo3        = { version = "0.22", features = ["extension-module"] }
numpy       = "0.22"
