[build-system]
# >=1.8 is a hard floor, not caution: 1.7 fails to parse PEP 639's
# `license-files` outright ("wanted string or table"). Verified 1.7.8 FAIL,
# 1.8.7 OK, 1.9.6 OK, 1.14.1 OK.
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[project]
name = "fairchild"
requires-python = ">=3.9"
description = "Open-source time-domain electro-optic circuit simulator"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy"]
# Taken from crates/fairchild-py/Cargo.toml, which inherits [workspace.package].
dynamic = ["version"]

# Keep this table LAST in [project]: a `[project.x]` header ends the [project]
# table, so any bare key after it (e.g. `dynamic`) silently lands in the wrong
# table and maturin then refuses to build for want of version information.
[project.optional-dependencies]
# Live KiCad schematic capture over the IPC API (fairchild.kicad). grpcio-tools
# is only needed to run python/fairchild/kicad/regen_protos.sh; pynng and
# protobuf are needed at runtime.
kicad = ["pynng", "protobuf", "grpcio-tools"]

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "crates/fairchild-py/Cargo.toml"
python-source = "python"
