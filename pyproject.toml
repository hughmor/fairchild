[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "fairchild"
requires-python = ">=3.9"
description = "Open-source time-domain electro-optic circuit simulator"
readme = "README.md"
license = {text = "Apache-2.0"}
dependencies = ["numpy"]

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "crates/fairchild-py/Cargo.toml"
python-source = "python"
